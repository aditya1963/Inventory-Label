<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Label Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <h1>Inventory Label Maker</h1>
      <p>Create A4 landscape labels from ticket images. Data stays in your browser only.</p>
    </section>

    <section class="card">
      <h2>1) Scan Sticker (Optional)</h2>
      <div class="row">
        <label class="file-input">
          <span>Choose Image</span>
          <input id="imageInput" type="file" accept="image/*" capture="environment">
        </label>
        <button id="scanBtn" type="button">Scan Fields</button>
      </div>
      <p id="scanStatus" class="status">Ready</p>
    </section>

    <section class="card">
      <h2>2) Confirm Fields</h2>
      <div class="field-grid">
        <label for="releaseInput">Release</label>
        <input id="releaseInput" type="text" maxlength="40" placeholder="e.g. M22849G">

        <label for="partInput">Part Number</label>
        <textarea id="partInput" rows="3" maxlength="120" placeholder="Long part number will wrap to next line"></textarea>
      </div>
    </section>

    <section class="card actions">
      <h2>3) Generate PDF</h2>
      <div class="row">
        <button id="pdfBtn" type="button" class="primary">Download A4 Label</button>
        <button id="clearBtn" type="button" class="ghost">Clear</button>
      </div>
      <p class="note">No backend. No database. No upload storage.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
